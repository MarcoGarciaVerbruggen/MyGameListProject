spring.application.name=gamingList
spring.config.import=optional:file:.env[.properties]

#Database Configuration
#persistenceModel: JPA; NOSQL;
app.persistenceModel=JPA
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER}
spring.jpa.properties.hibernate.dialect=${SPRING_DATASOURCE_DIALECT}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=update

#JWT Secret Key
security.jwt.secret-key=${JWT_SECRET_KEY}
security.jwt.expiration-time=3600000